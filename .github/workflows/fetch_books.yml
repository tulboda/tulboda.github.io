name: Fetch Hardcover Books

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch currently reading and mood
        env:
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          IMOOD_EMAIL: ${{ secrets.IMOOD_EMAIL }}
        run: python _scripts/fetch_hardcover.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/currently_reading.yml _data/mood.yml
          git diff --staged --quiet || git commit -m "Update currently reading and mood"
          git push