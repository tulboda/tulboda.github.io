---
layout: default
title: log
permalink: /blog/
---

{% for post in site.posts %}
<article>
  <h2>{{ post.title }}</h2>
  <p><a href="{{ post.url | relative_url }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time> ☍</a></p>
  {{ post.content }}
</article>
{% endfor %}
