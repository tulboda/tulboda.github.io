---
layout: default
title: blog
permalink: /blog/
---

{% for post in site.posts %}
<article>
  <header class="bar">
    <h3 class="tag">{{ post.title }}</h3>
    <time class="idx" datetime="{{ post.date | date_to_xmlschema }}"><a href="{{ post.url | relative_url }}">{{ post.date | date: "%Y-%m-%d" }}</a></time>
  </header>
  {{ post.content }}
</article>
{% endfor %}
