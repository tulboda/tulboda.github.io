<div id="totem" aria-hidden="true" style="position: fixed; bottom: 1rem; right: 1rem; width: 48px; gap: 4px; z-index: 100;">

  <!-- Ghost (witch hat) -->
  <svg viewBox="0 0 16 16" width="48" height="48" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>잡았다 요놈</title>
    <!-- witch hat cone -->
    <g fill="#1c1c2e">
      <rect x="7" y="0" width="2" height="1"/>
      <rect x="6" y="1" width="4" height="1"/>
      <rect x="6" y="2" width="4" height="1"/>
      <rect x="5" y="3" width="6" height="1"/>
    </g>
    <!-- hat band: orange -->
    <g fill="#e67e22">
      <rect x="5" y="3" width="6" height="1"/>
    </g>
    <!-- ghost body shifted down by 4 -->
    <g fill="#e8e1d4">
      <rect x="6" y="4" width="4" height="1"/>
      <rect x="4" y="5" width="8" height="1"/>
      <rect x="3" y="6" width="10" height="1"/>
      <rect x="2" y="7" width="11" height="1"/>
      <rect x="2" y="8" width="11" height="1"/>
      <rect x="2" y="9" width="11" height="1"/>
      <rect x="2" y="10" width="11" height="1"/>
      <rect x="2" y="11" width="11" height="1"/>
      <rect x="2" y="12" width="11" height="1"/>
      <rect x="2" y="13" width="11" height="1"/>
      <rect x="2" y="14" width="2" height="1"/>
      <rect x="5" y="14" width="2" height="1"/>
      <rect x="8" y="14" width="2" height="1"/>
      <rect x="11" y="14" width="2" height="1"/>
      <rect x="2" y="15" width="1" height="1"/>
      <rect x="6" y="15" width="1" height="1"/>
      <rect x="9" y="15" width="1" height="1"/>
      <rect x="12" y="15" width="1" height="1"/>
    </g>
    <!-- eyes + mouth -->
    <g fill="#1c2420">
      <rect x="5" y="8" width="1" height="2"/>
      <rect x="9" y="8" width="1" height="2"/>
      <rect x="7" y="11" width="2" height="1"/>
    </g>
    <!-- hat brim: drawn last so it sits on top of ghost head pixels -->
    <g fill="#2a2a3e">
      <rect x="3" y="4" width="10" height="1"/>
    </g>
  </svg>

  <!-- Frog -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>악마 개구리</title>
    <g fill="#6b8e4e">
      <rect x="4" y="1" width="2" height="1"/>
      <rect x="10" y="1" width="2" height="1"/>
      <rect x="3" y="2" width="1" height="2"/>
      <rect x="6" y="2" width="1" height="2"/>
      <rect x="9" y="2" width="1" height="2"/>
      <rect x="12" y="2" width="1" height="2"/>
      <rect x="3" y="4" width="10" height="1"/>
      <rect x="2" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="2" height="1"/>
      <rect x="12" y="6" width="2" height="1"/>
      <rect x="2" y="7" width="2" height="1"/>
      <rect x="12" y="7" width="2" height="1"/>
      <rect x="2" y="8" width="2" height="1"/>
      <rect x="12" y="8" width="2" height="1"/>
      <rect x="1" y="9" width="14" height="1"/>
      <rect x="0" y="10" width="3" height="1"/>
      <rect x="5" y="10" width="6" height="1"/>
      <rect x="13" y="10" width="3" height="1"/>
    </g>
    <g fill="#f0e6d2">
      <rect x="4" y="2" width="2" height="2"/>

    <g fill="#6b8e4e">

    </g>
    <g fill="#c8d4a0">
      <rect x="4" y="8" width="8" height="2"/>
    </g>
    <!-- eyes -->
    <g fill="#1c2420">
      <rect x="5" y="3" width="1" height="1"/>
      <rect x="11" y="3" width="1" height="1"/>
      <rect x="6" y="5" width="1" height="1"/>
      <rect x="9" y="5" width="1" height="1"/>
    </g>
    <!-- devil horns: red, on top of eye bumps -->
    <g fill="#c0392b">
      <rect x="4" y="0" width="1" height="1"/>
      <rect x="5" y="1" width="1" height="1"/>
      <rect x="11" y="0" width="1" height="1"/>
      <rect x="10" y="1" width="1" height="1"/>
    </g>
  </svg>

  <!-- Mushroom + jack-o-lantern -->
  <svg viewBox="0 0 16 14" width="48" height="42" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>버섯이다</title>
    <!-- mushroom cap -->
    <g fill="#b03a3a">
      <rect x="5" y="0" width="6" height="1"/>
      <rect x="3" y="1" width="10" height="1"/>
      <rect x="2" y="2" width="12" height="1"/>
      <rect x="2" y="3" width="12" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
    </g>
    <g fill="#f0e6d2">
      <rect x="4" y="1" width="1" height="1"/>
      <rect x="10" y="1" width="1" height="1"/>
      <rect x="5" y="2" width="1" height="1"/>
      <rect x="11" y="2" width="1" height="1"/>
      <rect x="8" y="3" width="1" height="1"/>
      <rect x="4" y="5" width="8" height="1"/>
      <rect x="4" y="6" width="8" height="1"/>
      <rect x="4" y="7" width="8" height="1"/>
      <rect x="5" y="8" width="6" height="1"/>
      <rect x="5" y="9" width="6" height="1"/>
      <rect x="4" y="10" width="8" height="1"/>
      <rect x="4" y="11" width="8" height="1"/>
    </g>
    <!-- mushroom face -->
    <g fill="#4a2424">
      <rect x="6" y="6" width="1" height="1"/>
      <rect x="9" y="6" width="1" height="1"/>
      <rect x="7" y="7" width="2" height="1"/>
    </g>
    <!-- jack-o-lantern: small, bottom right -->
    <!-- pumpkin body: orange -->
    <g fill="#e67e22">
      <rect x="11" y="9" width="4" height="1"/>
      <rect x="10" y="10" width="5" height="1"/>
      <rect x="10" y="11" width="5" height="1"/>

    </g>
    <!-- pumpkin stem: green -->
    <g fill="#27ae60">
      <rect x="12" y="8" width="1" height="1"/>
    </g>
    <!-- jack-o-lantern face: dark -->
    <g fill="#1c1c00">
      <!-- triangle eyes -->
      <rect x="11" y="10" width="1" height="1"/>
      <rect x="13" y="10" width="1" height="1"/>
      <!-- jagged mouth -->
      <rect x="11" y="11" width="1" height="1"/>
      <rect x="13" y="11" width="1" height="1"/>
      <rect x="12" y="12" width="1" height="1"/>
    </g>
    <!-- pumpkin glow: yellow inner -->
    <g fill="#f1c40f">
      <rect x="12" y="10" width="1" height="1"/>
    </g>
  </svg>

</div>
