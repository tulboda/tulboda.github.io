<div id="totem" aria-hidden="true" style="position: fixed; bottom: 1rem; right: 1rem; width: 48px; display: flex; flex-direction: column; gap: 4px; z-index: 100;">

  <!-- Ghost on top -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>잡았다 요놈</title>
    <g fill="#e8e1d4">
      <rect x="6" y="0" width="4" height="1"/>
      <rect x="4" y="1" width="8" height="1"/>
      <rect x="3" y="2" width="10" height="1"/>
      <rect x="2" y="3" width="11" height="1"/>
      <rect x="2" y="4" width="11" height="1"/>
      <rect x="2" y="5" width="11" height="1"/>
      <rect x="2" y="6" width="11" height="1"/>
      <rect x="2" y="7" width="11" height="1"/>
      <rect x="2" y="8" width="11" height="1"/>
      <rect x="2" y="9" width="11" height="1"/>
      <rect x="2" y="10" width="2" height="1"/>
      <rect x="5" y="10" width="2" height="1"/>
      <rect x="8" y="10" width="2" height="1"/>
      <rect x="11" y="10" width="2" height="1"/>
      <rect x="2" y="11" width="1" height="1"/>
      <rect x="6" y="11" width="1" height="1"/>
      <rect x="9" y="11" width="1" height="1"/>
      <rect x="12" y="11" width="1" height="1"/>
    </g>
    <g fill="#1c2420">
      <rect x="5" y="4" width="1" height="2"/>
      <rect x="9" y="4" width="1" height="2"/>
      <rect x="7" y="7" width="2" height="1"/>
    </g>
    <!-- tiny heart on head -->
    <g fill="#d94f7a">
      <rect x="6" y="0" width="1" height="1"/>
      <rect x="8" y="0" width="1" height="1"/>
      <rect x="6" y="1" width="3" height="1"/>
      <rect x="7" y="2" width="1" height="1"/>
    </g>
  </svg>

  <!-- Frog in middle -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>WHATEVER IT'S 2009</title>
    <g fill="#6b8e4e">
      <rect x="4" y="1" width="2" height="1"/>
      <rect x="10" y="1" width="2" height="1"/>
      <rect x="3" y="2" width="1" height="2"/>
      <rect x="6" y="2" width="1" height="2"/>
      <rect x="9" y="2" width="1" height="2"/>
      <rect x="12" y="2" width="1" height="2"/>
      <rect x="3" y="4" width="10" height="1"/>
      <rect x="2" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="2" height="1"/>
      <rect x="12" y="6" width="2" height="1"/>
      <rect x="2" y="7" width="2" height="1"/>
      <rect x="12" y="7" width="2" height="1"/>
      <rect x="2" y="8" width="2" height="1"/>
      <rect x="12" y="8" width="2" height="1"/>
      <rect x="1" y="9" width="14" height="1"/>
      <rect x="0" y="10" width="3" height="1"/>
      <rect x="5" y="10" width="6" height="1"/>
      <rect x="13" y="10" width="3" height="1"/>
    </g>
    <g fill="#f0e6d2">
      <rect x="4" y="2" width="2" height="2"/>
      <rect x="10" y="2" width="2" height="2"/>
    </g>
    <g fill="#c8d4a0">
      <rect x="4" y="6" width="8" height="3"/>
    </g>
    <!-- heart eyes -->
    <g fill="#d94f7a">
      <!-- left eye heart -->
      <rect x="4" y="2" width="1" height="1"/>
      <rect x="6" y="2" width="1" height="1"/>
      <rect x="4" y="3" width="3" height="1"/>
      <rect x="5" y="4" width="1" height="1"/>
      <!-- right eye heart -->
      <rect x="10" y="2" width="1" height="1"/>
      <rect x="12" y="2" width="1" height="1"/>
      <rect x="10" y="3" width="3" height="1"/>
      <rect x="11" y="4" width="1" height="1"/>
    </g>
  </svg>

  <!-- Heart mushroom on bottom -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>하트 버섯</title>
    <!-- heart cap: pink/red -->
    <g fill="#d94f7a">
      <!-- y=0: two lobes, 4px gap -->
      <rect x="2" y="0" width="4" height="1"/>
      <rect x="10" y="0" width="4" height="1"/>
      <!-- y=1: lobes at full width, gap closes to 1px notch -->
      <rect x="1" y="1" width="6" height="1"/>
      <rect x="9" y="1" width="6" height="1"/>
      <!-- y=2 onwards: fully joined -->
      <rect x="1" y="2" width="14" height="1"/>
      <rect x="1" y="3" width="14" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
      <rect x="3" y="5" width="10" height="1"/>
      <rect x="4" y="6" width="8" height="1"/>
      <rect x="5" y="7" width="6" height="1"/>
      <rect x="6" y="8" width="4" height="1"/>
      <rect x="7" y="9" width="2" height="1"/>
    </g>
    <!-- highlight: lighter pink on top-left of each lobe -->
    <g fill="#f07aa0">
      <rect x="2" y="0" width="2" height="1"/>
      <rect x="1" y="1" width="2" height="1"/>
      <rect x="11" y="0" width="2" height="1"/>
      <rect x="9" y="1" width="2" height="1"/>
    </g>
    <!-- stem -->
    <g fill="#f0e6d2">
      <rect x="5" y="10" width="6" height="1"/>
      <rect x="5" y="11" width="6" height="1"/>
    </g>
    <!-- face on heart -->
    <g fill="#7a1535">
      <rect x="5" y="3" width="1" height="2"/>
      <rect x="10" y="3" width="1" height="2"/>
      <rect x="7" y="6" width="2" height="1"/>
    </g>
  </svg>

</div>
