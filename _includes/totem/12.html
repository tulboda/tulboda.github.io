  <!-- Frog (reindeer antlers pointing UP, Rudolph nose) -->
  <svg viewBox="0 0 16 14" width="48" height="42" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>WHATEVER IT'S 2009</title>
    <!-- antlers: drawn first so body paints over base -->
    <g fill="#8b4513">
      <!-- LEFT: base at x=3,y=5 beside left eye bump, trunk goes UP (decreasing y) -->
      <rect x="3" y="5" width="1" height="1"/>
      <rect x="2" y="4" width="1" height="1"/>
      <rect x="2" y="3" width="1" height="1"/>
      <rect x="1" y="2" width="1" height="1"/>
      <!-- inner short branch: splits up-right from trunk -->
      <rect x="2" y="2" width="1" height="1"/>
      <rect x="3" y="1" width="1" height="1"/>
      <!-- outer long branch: continues up-left -->
      <rect x="0" y="2" width="1" height="1"/>
      <rect x="0" y="1" width="1" height="1"/>
      <rect x="1" y="0" width="1" height="1"/>

      <!-- RIGHT: base at x=12,y=5 beside right eye bump -->
      <rect x="12" y="5" width="1" height="1"/>
      <rect x="13" y="4" width="1" height="1"/>
      <rect x="13" y="3" width="1" height="1"/>
      <rect x="14" y="2" width="1" height="1"/>
      <!-- inner short branch: splits up-left -->
      <rect x="13" y="2" width="1" height="1"/>
      <rect x="12" y="1" width="1" height="1"/>
      <!-- outer long branch: continues up-right -->
      <rect x="15" y="2" width="1" height="1"/>
      <rect x="15" y="1" width="1" height="1"/>
      <rect x="14" y="0" width="1" height="1"/>
    </g>
    <!-- frog body shifted down 2px -->
    <g fill="#6b8e4e">
      <rect x="4" y="3" width="2" height="1"/>
      <rect x="10" y="3" width="2" height="1"/>
      <rect x="3" y="4" width="1" height="2"/>
      <rect x="6" y="4" width="1" height="2"/>
      <rect x="9" y="4" width="1" height="2"/>
      <rect x="12" y="4" width="1" height="2"/>
      <rect x="3" y="6" width="10" height="1"/>
      <rect x="2" y="7" width="12" height="1"/>

      <rect x="2" y="9" width="2" height="1"/>
      <rect x="12" y="9" width="2" height="1"/>
      <rect x="2" y="10" width="2" height="1"/>
      <rect x="12" y="10" width="2" height="1"/>
      <rect x="1" y="11" width="14" height="1"/>
      <rect x="0" y="12" width="3" height="1"/>
      <rect x="5" y="12" width="6" height="1"/>
      <rect x="13" y="12" width="3" height="1"/>
    </g>
    <g fill="#f0e6d2">
      <rect x="4" y="4" width="2" height="2"/>
      <rect x="10" y="4" width="2" height="2"/>
    </g>
    <g fill="#c8d4a0">
      <rect x="4" y="8" width="8" height="3"/>
    </g>
    <!-- eyes -->
    <g fill="#1c2420">
      <rect x="5" y="5" width="1" height="1"/>
      <rect x="11" y="5" width="1" height="1"/>
    </g>
    <!-- Rudolph nose: 2x2 centered between eyes and mouth -->
    <g fill="#c0392b">
      <rect x="7" y="6" width="2" height="2"/>
    </g>
  </svg>

  <!-- Present (red like mushroom, gold bow, no dots) -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>선물이다</title>
    <!-- gold bow loops -->
    <g fill="#c8960c">
      <rect x="4" y="0" width="3" height="1"/>
      <rect x="3" y="1" width="3" height="1"/>
