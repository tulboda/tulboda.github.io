  <svg viewBox="0 0 16 15" width="48" height="45" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>튤립이다</title>
    <!-- pink tulip body -->

      <!-- 3 even peaks at x=3-4, x=7-8, x=11-12 (each 2 wide, gaps of 2 between) -->
