<div id="totem" aria-hidden="true" style="position: fixed; bottom: 1rem; right: 1rem; width: 48px; gap: 4px; z-index: 100;">

  <!-- Red leaf (ghost face) -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>단풍잎</title>
    <!-- stem -->
    <g fill="#6b3a1f">
      <rect x="7" y="10" width="2" height="2"/>
    </g>
    <!-- leaf body: rounded lobe shape -->
    <g fill="#c0392b">
      <rect x="6" y="1" width="4" height="1"/>
      <rect x="4" y="2" width="8" height="1"/>
      <rect x="3" y="3" width="10" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
      <rect x="2" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="12" height="1"/>
      <rect x="3" y="7" width="10" height="1"/>
      <rect x="4" y="8" width="8" height="1"/>
      <rect x="5" y="9" width="6" height="1"/>
    </g>
    <!-- highlight: lighter red along top-left -->
    <g fill="#e74c3c">
      <rect x="6" y="1" width="3" height="1"/>
      <rect x="4" y="2" width="4" height="1"/>
      <rect x="3" y="3" width="3" height="1"/>
      <rect x="2" y="4" width="2" height="1"/>
    </g>
    <!-- vein: darker -->
    <g fill="#922b21">
      <rect x="7" y="2" width="1" height="7"/>
      <rect x="5" y="4" width="2" height="1"/>
      <rect x="9" y="4" width="2" height="1"/>
      <rect x="4" y="6" width="2" height="1"/>
      <rect x="10" y="6" width="2" height="1"/>
    </g>
    <!-- ghost face -->
    <g fill="#1c2420">
      <rect x="5" y="4" width="1" height="2"/>
      <rect x="9" y="4" width="1" height="2"/>
      <rect x="7" y="7" width="2" height="1"/>
    </g>
  </svg>

  <!-- Yellow leaf (frog face) -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>노란 단풍잎</title>
    <!-- stem -->
    <g fill="#6b3a1f">
      <rect x="7" y="10" width="2" height="2"/>
    </g>
    <!-- leaf body -->
    <g fill="#f1c40f">
      <rect x="6" y="1" width="4" height="1"/>
      <rect x="4" y="2" width="8" height="1"/>
      <rect x="3" y="3" width="10" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
      <rect x="2" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="12" height="1"/>
      <rect x="3" y="7" width="10" height="1"/>
      <rect x="4" y="8" width="8" height="1"/>
      <rect x="5" y="9" width="6" height="1"/>
    </g>
    <!-- highlight -->
    <g fill="#f7dc6f">
      <rect x="6" y="1" width="3" height="1"/>
      <rect x="4" y="2" width="4" height="1"/>
      <rect x="3" y="3" width="3" height="1"/>
      <rect x="2" y="4" width="2" height="1"/>
    </g>
    <!-- vein -->
    <g fill="#b7950b">
      <rect x="7" y="2" width="1" height="7"/>
      <rect x="5" y="4" width="2" height="1"/>
      <rect x="9" y="4" width="2" height="1"/>
      <rect x="4" y="6" width="2" height="1"/>
      <rect x="10" y="6" width="2" height="1"/>
    </g>
    <!-- frog face: eyes and wide mouth -->
    <g fill="#1c2420">
      <rect x="5" y="4" width="1" height="1"/>
      <rect x="10" y="4" width="1" height="1"/>
      <rect x="4" y="6" width="8" height="1"/>
    </g>
  </svg>

  <!-- Orange leaf (mushroom face) -->
  <svg viewBox="0 0 16 12" width="48" height="36" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; shape-rendering: crispEdges;">
    <title>주황 단풍잎</title>
    <!-- stem -->
    <g fill="#6b3a1f">
      <rect x="7" y="10" width="2" height="2"/>
    </g>
    <!-- leaf body -->
    <g fill="#e67e22">
      <rect x="6" y="1" width="4" height="1"/>
      <rect x="4" y="2" width="8" height="1"/>
      <rect x="3" y="3" width="10" height="1"/>
      <rect x="2" y="4" width="12" height="1"/>
      <rect x="2" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="12" height="1"/>
      <rect x="3" y="7" width="10" height="1"/>
      <rect x="4" y="8" width="8" height="1"/>
      <rect x="5" y="9" width="6" height="1"/>
    </g>
    <!-- highlight -->
    <g fill="#f39c12">
      <rect x="6" y="1" width="3" height="1"/>
      <rect x="4" y="2" width="4" height="1"/>
      <rect x="3" y="3" width="3" height="1"/>
      <rect x="2" y="4" width="2" height="1"/>
    </g>
    <!-- vein -->
    <g fill="#a04000">
      <rect x="7" y="2" width="1" height="7"/>
      <rect x="5" y="4" width="2" height="1"/>
      <rect x="9" y="4" width="2" height="1"/>
      <rect x="4" y="6" width="2" height="1"/>
      <rect x="10" y="6" width="2" height="1"/>
    </g>
    <!-- mushroom face -->
    <g fill="#4a2424">
      <rect x="6" y="5" width="1" height="1"/>
      <rect x="9" y="5" width="1" height="1"/>
      <rect x="7" y="6" width="2" height="1"/>
    </g>
  </svg>

</div>
